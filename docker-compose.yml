services:
  koel:
    # Built from this repository's source (see Dockerfile), not pulled from Docker Hub
    build:
      context: .
      args:
        BASE_IMAGE: phanan/koel:${KOEL_BASE_VERSION:-9.15.0}
    image: koel-local:latest
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "${KOEL_PORT:-8888}:80"
    environment:
      # Generate once and keep it: docker run --rm --entrypoint php koel-local:latest artisan key:generate --show
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_URL: ${APP_URL:-http://umbrel.local:8888}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_DATABASE: koel
      DB_USERNAME: koel
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - ${MUSIC_PATH:-/home/umbrel/umbrel/home/Downloads}:/music
      - images:/var/www/html/storage/app/public/images
      - search_index:/var/www/html/storage/search-indexes

  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: koel
      MYSQL_USER: koel
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql

volumes:
  db:
  images:
  search_index:
