# Both services use the host network: on Umbrel's Arcane (docker-in-docker) traffic that has to be
# forwarded over a bridge is dropped, so container-to-container and outbound traffic would fail.
# Koel therefore listens on KOEL_PORT and MariaDB on DB_PORT (localhost only) of the host.
services:
  koel:
    # Built from this repository's source (see Dockerfile); nothing is pulled for Koel itself
    build:
      context: .
      # Build containers use the host network so they inherit its DNS (fixes EAI_AGAIN on some hosts)
      network: host
    restart: unless-stopped
    network_mode: host
    depends_on:
      - database
    environment:
      KOEL_PORT: ${KOEL_PORT:-8888}
      # Generate once and keep it: echo "base64:$(openssl rand -base64 32)"
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_URL: ${APP_URL:-http://umbrel.local:8888}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: ${DB_PORT:-33306}
      DB_DATABASE: koel
      DB_USERNAME: koel
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - ${MUSIC_PATH:-/home/umbrel/umbrel/home/Downloads}:/music
      - images:/var/www/html/storage/app/public/images
      - search_index:/var/www/html/storage/search-indexes
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${KOEL_PORT}/sw.js || exit 1"]
      start_period: 60s
      interval: 1m
      timeout: 5s
      retries: 3

  database:
    image: mariadb:10.11
    restart: unless-stopped
    network_mode: host
    command: ["--port=${DB_PORT:-33306}", "--bind-address=127.0.0.1"]
    environment:
      MYSQL_DATABASE: koel
      MYSQL_USER: koel
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql

volumes:
  db:
  images:
  search_index:
